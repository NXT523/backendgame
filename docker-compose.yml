version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: redis-local
    command: ["redis-server","--save","60","1","--appendonly","yes","--loglevel","warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  memcached:
    image: memcached:1.6
    container_name: memcached-local
    command: ["-m","256","-I","1m","-c","1024"] 
    ports:
      - "11211:11211"
    restart: unless-stopped

    # 👇 THÊM ZOOKEEPER
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"   # cho các container khác
      - "9093:9093"   # cho app Go ở ngoài host
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # 2 listener: trong docker và ngoài host
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # UI chạy trong docker → nó nhìn thấy "kafka" luôn
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
# ELASTICSEARCH + KIBANA
  # ==========================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node          # chạy 1 node thôi
      - xpack.security.enabled=false        # tắt auth cho dễ test
      - ES_JAVA_OPTS=-Xms512m -Xmx512m      # giảm RAM để máy yếu vẫn chạy
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:              # ES hay đòi cái này
      memlock:
        soft: -1
        hard: -1
        
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.2
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # 👇 tắt CSP strict + tắt cảnh báo browser cũ
      - XPACK_SECURITY_ENABLED=false 
      - CSP_STRICT=false
      - CSP_WARNLEGACYBROWSERS=false
      # (tùy) nếu mở từ máy này:5601 thì khai báo luôn
      - SERVER_PUBLICBASEURL=http://localhost:5601
    ports:
      - "5601:5601"
    restart: unless-stopped

volumes:
  redis_data:
  zk_data:
  zk_log:
  kafka_data:
  es_data: